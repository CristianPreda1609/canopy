name: Release

# Push a tag like `v0.1.0` to build installers for Windows, macOS and Linux
# and attach them to a draft GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ''
          - name: linux
            os: ubuntu-22.04
            args: ''
          - name: macos-arm64
            os: macos-latest
            args: '--target aarch64-apple-darwin'
          - name: macos-x64
            os: macos-latest
            args: '--target x86_64-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Installs the version pinned in src-tauri/rust-toolchain.toml
      - name: Install Rust toolchain
        working-directory: src-tauri
        run: rustup toolchain install
      - name: Add macOS targets
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Per-build config overrides, merged into one --config JSON:
      #  - no TAURI_SIGNING_PRIVATE_KEY secret -> build without update files
      #  - tags containing "-tiling" (e.g. v0.2.0-tiling.1) -> "Canopy Tiling",
      #    a separate app id so it installs side by side with Canopy
      - name: Build config
        id: config
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          parts=()
          if [ -z "$KEY" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; building without auto-update artifacts"
            parts+=('"bundle":{"createUpdaterArtifacts":false}')
          fi
          case "$TAG" in
            *-tiling*)
              parts+=('"productName":"Canopy Tiling"' '"identifier":"com.cristianpreda.canopy.tiling"')
              echo "name=Canopy Tiling $TAG" >> "$GITHUB_OUTPUT"
              echo "app=Canopy Tiling" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "name=Canopy $TAG" >> "$GITHUB_OUTPUT"
              echo "app=Canopy" >> "$GITHUB_OUTPUT" ;;
          esac
          if [ ${#parts[@]} -gt 0 ]; then
            json="{$(IFS=,; echo "${parts[*]}")}"
            echo "Config override: $json"
            echo "args=--config '$json'" >> "$GITHUB_OUTPUT"
          fi

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx --yes @tauri-apps/cli@2
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ steps.config.outputs.name }}
          releaseBody: 'See the assets below to download Canopy for your platform.'
          releaseDraft: true
          # Tags with a suffix (v1.2.0-beta, v0.2.0-tiling.1) are pre-releases
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }} ${{ steps.config.outputs.args }}
          includeUpdaterJson: true

      # Portable Windows build: the app is a single exe (frontend embedded,
      # WebView2 comes with Windows), so zip it with a readme. No installer,
      # no admin rights. Uploaded to the same (draft) release.
      - name: Portable zip (Windows)
        if: runner.os == 'Windows' && github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
          APP: ${{ steps.config.outputs.app }}
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $dir = Join-Path portable $env:APP
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item src-tauri/target/release/canopy.exe (Join-Path $dir "$env:APP.exe")
          Copy-Item docs/PORTABLE.txt (Join-Path $dir 'README.txt')
          $zip = "$($env:APP -replace ' ', '_')_${ver}_x64_portable.zip"
          Compress-Archive -Path $dir -DestinationPath $zip -Force
          $uri = "https://uploads.github.com/repos/${{ github.repository }}/releases/$env:RELEASE_ID/assets?name=$zip"
          Invoke-RestMethod -Method Post -Uri $uri -InFile $zip -ContentType 'application/zip' `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' } | Out-Null
          Write-Host "Uploaded $zip"
