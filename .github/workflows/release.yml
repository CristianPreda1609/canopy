name: Release

# Push a tag like `v0.1.0` to build installers for Windows, macOS and Linux
# and attach them to a draft GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ''
          - name: linux
            os: ubuntu-22.04
            args: ''
          - name: macos-arm64
            os: macos-latest
            args: '--target aarch64-apple-darwin'
          - name: macos-x64
            os: macos-latest
            args: '--target x86_64-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx --yes @tauri-apps/cli@2
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'Canopy ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download Canopy for your platform.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
